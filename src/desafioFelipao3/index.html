<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Mini Game - Herói</title>
  <style>
    body {
      font-family: Arial;
      background: #121212;
      color: white;
      text-align: center;
    }
    input, select, button {
      margin: 5px;
      padding: 10px;
      border-radius: 5px;
      border: none;
    }
    button {
      background: #00c853;
      color: white;
      cursor: pointer;
    }
    #log {
      margin-top: 20px;
      background: #1e1e1e;
      padding: 10px;
      height: 200px;
      overflow-y: auto;
      text-align: left;
    }
  </style>
</head>
<body>

  <h1>⚔️ Criador de Herói</h1>

  <input type="text" id="nome" placeholder="Nome do herói">
  <input type="number" id="idade" placeholder="Idade">
  
  <select id="tipo">
    <option value="mago">Mago</option>
    <option value="guerreiro">Guerreiro</option>
    <option value="monge">Monge</option>
    <option value="ninja">Ninja</option>
  </select>

  <br>

  <button onclick="criarHeroi()">Criar Herói</button>
  <button onclick="atacar()">Atacar</button>

  <h2 id="status"></h2>

  <div id="log"></div>

  <script>
    class Heroi {
      constructor(nome, idade, tipo) {
        this.nome = nome;
        this.idade = idade;
        this.tipo = tipo;
        this.vida = 100;
      }

      atacar() {
        const ataques = {
          mago: "magia",
          guerreiro: "espada",
          monge: "artes marciais",
          ninja: "shuriken"
        };

        let ataque = ataques[this.tipo] || "ataque desconhecido";

        // dano aleatório
        let dano = Math.floor(Math.random() * 20) + 5;

        return {
          mensagem: `o ${this.tipo} atacou usando ${ataque} e causou ${dano} de dano`,
          dano: dano
        };
      }
    }

    let heroi = null;
    let inimigoVida = 100;

    function criarHeroi() {
      const nome = document.getElementById("nome").value;
      const idade = document.getElementById("idade").value;
      const tipo = document.getElementById("tipo").value;

      heroi = new Heroi(nome, idade, tipo);

      atualizarStatus();
      log(`Herói ${nome} criado!`);
    }

    function atacar() {
      if (!heroi) {
        alert("Crie um herói primeiro!");
        return;
      }

      let resultado = heroi.atacar();
      inimigoVida -= resultado.dano;

      log(resultado.mensagem);

      // inimigo contra-ataca
      let danoInimigo = Math.floor(Math.random() * 15) + 5;
      heroi.vida -= danoInimigo;

      log(`Inimigo atacou e causou ${danoInimigo} de dano`);

      verificarFim();
      atualizarStatus();
    }

    function atualizarStatus() {
      document.getElementById("status").innerText =
        `❤️ Vida do Herói: ${heroi ? heroi.vida : 0} | 👾 Vida do Inimigo: ${inimigoVida}`;
    }

    function verificarFim() {
      if (heroi.vida <= 0) {
        log("💀 Você perdeu!");
        desativarJogo();
      } else if (inimigoVida <= 0) {
        log("🏆 Você venceu!");
        desativarJogo();
      }
    }

    function desativarJogo() {
      document.querySelectorAll("button").forEach(btn => btn.disabled = true);
    }

    function log(texto) {
      const logDiv = document.getElementById("log");
      logDiv.innerHTML += texto + "<br>";
      logDiv.scrollTop = logDiv.scrollHeight;
    }
  </script>

</body>
</html>
