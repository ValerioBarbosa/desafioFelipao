<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Mini Game - Herói</title>
  <style>
    body {
      font-family: Arial;
      background: #121212;
      color: white;
      text-align: center;
    }
    input, select, button {
      margin: 5px;
      padding: 10px;
      border-radius: 5px;
      border: none;
    }
    button {
      background: #00c853;
      color: white;
      cursor: pointer;
    }
    #log {
      margin-top: 20px;
      background: #1e1e1e;
      padding: 10px;
      height: 200px;
      overflow-y: auto;
      text-align: left;
    }
  </style>
</head>
<body>

  <h1>⚔️ Criador de Herói</h1>

  <input type="text" id="nome" placeholder="Nome do herói">
  <input type="number" id="idade" placeholder="Idade">
  
  <select id="tipo">
    <option value="mago">Mago</option>
    <option value="guerreiro">Guerreiro</option>
    <option value="monge">Monge</option>
    <option value="ninja">Ninja</option>
  </select>

  <br>

  <button id="btnCriar">Criar Herói</button>
  <button id="btnAtacar">Atacar</button>

  <h2 id="status"></h2>

  <div id="log"></div>

  <script src="index.js"></script>

</body>
</html>
