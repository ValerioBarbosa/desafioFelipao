<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⚔️ Herói vs Inimigo - Mini Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="game-container">
    <h1>⚔️ Criador de Herói</h1>

    <div class="setup-section">
      <input type="text" id="nome" placeholder="Nome do herói" class="full-width">
      <input type="number" id="idade" placeholder="Idade">
      <select id="tipo">
        <option value="mago">Mago</option>
        <option value="guerreiro">Guerreiro</option>
        <option value="monge">Monge</option>
        <option value="ninja">Ninja</option>
      </select>
    </div>

    <div class="button-group">
      <button id="btnCriar">Criar Herói</button>
      <button id="btnAtacar" disabled>Atacar</button>
    </div>

    <div class="battle-area">
      <div class="entity-status" id="hero-card">
        <span class="entity-name" id="hero-display-name">Herói</span>
        <div class="health-bar-container">
          <div class="health-bar" id="hero-health-bar"></div>
        </div>
        <small id="hero-hp-text">HP: 100/100</small>
      </div>

      <div class="entity-status" id="enemy-card">
        <span class="entity-name">Inimigo 👾</span>
        <div class="health-bar-container">
          <div class="health-bar enemy-bar" id="enemy-health-bar"></div>
        </div>
        <small id="enemy-hp-text">HP: 100/100</small>
      </div>
    </div>

    <div id="log"></div>
  </div>

  <script src="index.js"></script>

</body>
</html>
